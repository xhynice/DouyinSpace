[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid
loglevel=info

[program:barrage]
command=python3 /app/DouyinBarrage/main.py --all
directory=/app/DouyinBarrage
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=999
stdout_logfile=/data/logs/barrage_stdout.log
stderr_logfile=/data/logs/barrage_stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:webapp]
command=python3 /app/app.py
directory=/app
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/data/logs/webapp_stdout.log
stderr_logfile=/data/logs/webapp_stderr.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:dufs]
command=/usr/local/bin/dufs / -A -p 5000 --path-prefix /files --auth admin:%(ENV_DUFS_PASSWORD)s@/:rw
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/data/logs/dufs_stdout.log
stderr_logfile=/data/logs/dufs_stderr.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/data/logs/nginx_stdout.log
stderr_logfile=/data/logs/nginx_stderr.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/data/logs/cron_stdout.log
stderr_logfile=/data/logs/cron_stderr.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1
