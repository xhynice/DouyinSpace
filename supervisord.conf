[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:barrage]
command=python3 /app/DouyinBarrage/main.py --all
directory=/app/DouyinBarrage
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=999
stdout_logfile=/data/logs/barrage_stdout.log
stderr_logfile=/data/logs/barrage_stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:webapp]
command=gunicorn app:app -b 0.0.0.0:7861 -w 2 --threads 4 --timeout 30 --graceful-timeout 10 --max-requests 2000 --max-requests-jitter 200
directory=/app
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
# stdout 无输出，stderr 只保留 gunicorn 错误（app.py 日志写 panel.log）
stdout_logfile=/dev/null
stderr_logfile=/data/logs/webapp_stderr.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:dufs]
command=/usr/local/bin/dufs / -A -p 5000 --path-prefix /files --auth admin:%(ENV_DUFS_PASSWORD)s@/:rw
autostart=true
autorestart=true
startsecs=3
# stdout 是访问日志（噪音），stderr 保留错误
stdout_logfile=/dev/null
stderr_logfile=/data/logs/dufs_stderr.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/null
stderr_logfile=/data/logs/nginx_stderr.log
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
