<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{{ filename }}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 640 512%22%3E%3Cpath fill=%22rgb(255, 212, 59)%22 d=%22M352 0c0-17.7-14.3-32-32-32S288-17.7 288 0l0 64-96 0c-53 0-96 43-96 96l0 224c0 53 43 96 96 96l256 0c53 0 96-43 96-96l0-224c0-53-43-96-96-96l-96 0 0-64zM160 368c0-13.3 10.7-24 24-24l32 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-32 0c-13.3 0-24-10.7-24-24zm120 0c0-13.3 10.7-24 24-24l32 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-32 0c-13.3 0-24-10.7-24-24zm120 0c0-13.3 10.7-24 24-24l32 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-32 0c-13.3 0-24-10.7-24-24zM224 176a48 48 0 1 1 0 96 48 48 0 1 1 0-96zm144 48a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zM64 224c0-17.7-14.3-32-32-32S0 206.3 0 224l0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96zm544-32c-17.7 0-32 14.3-32 32l0 96c0 17.7 14.3 32 32 32s32-14.3 32-32l0-96c0-17.7-14.3-32-32-32z%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
<style>
:root{--bg:#f5f7fa;--border:#e5e6eb;--blue:#1677ff;--muted:#86909c;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;font-family:Inter,-apple-system,sans-serif;color:#1d2129;font-size:14px}

/* PC布局 */
.play-layout{display:flex;height:100vh;max-width:1400px;margin:0 auto}
.play-left{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#000}
.play-right{width:380px;display:flex;flex-direction:column;border-left:1px solid var(--border);background:#fff}

/* 视频 */
#dplayer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f5f7fa}
#dplayer video{max-width:100%;max-height:100vh;object-fit:contain}

/* 弹幕面板 */
.barrage-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100vh}
.barrage-header{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff}
.barrage-header h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.header-actions{display:flex;align-items:center;gap:6px}
.header-actions .icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;color:var(--muted);font-size:15px}
.header-actions .icon-btn:hover{background:#f5f7fa;color:var(--blue)}
.header-actions .meta{font-size:11px;color:var(--muted)}
.header-actions label{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:11px}
.header-actions input{margin:0}

/* 弹幕列表 */
.barrage-list{flex:1;overflow-y:auto;padding:4px 0}
.barrage-item{padding:5px 12px;cursor:pointer;line-height:1.5;overflow:hidden}
.barrage-item:hover{background:#f5f7fa}
.barrage-item.active{background:#e8f3ff}
.barrage-item .user{color:#ff6a00;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;line-height:1.4}
.barrage-item .user:hover{text-decoration:underline}
.barrage-item .user-info{float:left;display:flex;align-items:baseline;gap:3px;flex-shrink:0;line-height:1.4;margin-right:5px}
.barrage-item .grade{font-size:10px;padding:1px 4px;border-radius:3px;font-weight:600}
.barrage-item .content{font-size:12px;word-break:break-word;line-height:1.4;overflow:hidden}
.barrage-item .fans{font-size:10px;padding:1px 4px;border-radius:3px;font-weight:600;min-width:20px;text-align:center}

/* 抖音财富等级颜色 Lv1-75 */
.grade-1,.grade-2,.grade-3,.grade-4,.grade-5{background:#f5f5f5;color:#333;border:1px solid #ddd}
.grade-6,.grade-7,.grade-8,.grade-9,.grade-10,.grade-11,.grade-12{background:#e3f2fd;color:#1565c0}
.grade-13,.grade-14,.grade-15,.grade-16,.grade-17,.grade-18,.grade-19,.grade-20{background:#e8f5e9;color:#2e7d32}
.grade-21,.grade-22,.grade-23,.grade-24,.grade-25,.grade-26,.grade-27,.grade-28,.grade-29,.grade-30{background:#e3f2fd;color:#0d47a1}
.grade-31,.grade-32,.grade-33,.grade-34,.grade-35,.grade-36,.grade-37,.grade-38,.grade-39,.grade-40{background:#f3e5f5;color:#7b1fa2}
.grade-41,.grade-42,.grade-43,.grade-44,.grade-45,.grade-46,.grade-47,.grade-48,.grade-49,.grade-50{background:#fce4ec;color:#c62828}
.grade-51,.grade-52,.grade-53,.grade-54,.grade-55,.grade-56,.grade-57,.grade-58,.grade-59,.grade-60{background:#fff8e1;color:#f57f17}
.grade-61,.grade-62,.grade-63,.grade-64,.grade-65,.grade-66,.grade-67,.grade-68,.grade-69{background:#212121;color:#ffd54f}
.grade-70,.grade-71,.grade-72,.grade-73,.grade-74,.grade-75{background:#1a1a2e;color:#e94560;text-shadow:0 0 4px rgba(233,69,96,.5)}

/* 粉丝团等级颜色 Lv1-25 浅黄→深黄 */
.fans-1,.fans-2,.fans-3,.fans-4,.fans-5{background:#fffde7;color:#f9a825;border:1px solid #f9a825}
.fans-6,.fans-7,.fans-8,.fans-9,.fans-10{background:#fff9c4;color:#f57f17;border:1px solid #f57f17}
.fans-11,.fans-12,.fans-13,.fans-14,.fans-15{background:#fff59d;color:#ee8100;border:1px solid #ee8100}
.fans-16,.fans-17,.fans-18,.fans-19,.fans-20{background:#ffee58;color:#e65100;border:1px solid #e65100}
.fans-21,.fans-22,.fans-23,.fans-24,.fans-25{background:#fdd835;color:#bf360c;border:1px solid #bf360c}
.barrage-item .at{color:var(--blue);cursor:pointer;font-weight:500}
.barrage-item .at:hover{text-decoration:underline}
.barrage-item.gift{background:#fff7e6}
.barrage-item.social{background:#e8ffea}
.barrage-item.like{opacity:.7}
.barrage-item.lucky_bag{background:#fff2f0}
.barrage-item .content img{width:16px;height:16px;vertical-align:middle;margin:0 1px}

/* 筛选栏 */
.barrage-filter{padding:8px 12px;border-top:1px solid var(--border);background:#fafafa;flex-shrink:0;position:relative}
.search-row{display:none;gap:6px;align-items:center}
.search-row.show{display:flex}
.search-row .dropdown{position:relative}
.search-row .dropdown-btn{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:4px}
.search-row .dropdown-btn:hover{background:#f5f7fa}
.search-row .dropdown-menu{display:none;position:absolute;bottom:100%;left:0;background:#fff;border:1px solid var(--border);border-radius:4px 4px 0 0;z-index:20;min-width:80px;box-shadow:0 -2px 8px rgba(0,0,0,.1)}
.search-row .dropdown-menu.show{display:block}
.search-row .dropdown-item{padding:6px 12px;font-size:12px;cursor:pointer}
.search-row .dropdown-item:hover{background:#f5f7fa}
.search-row .dropdown-item.active{background:#e8f3ff;color:var(--blue)}
.search-row input{flex:1;height:28px;border:1px solid var(--border);border-radius:4px;padding:0 8px;font-size:12px}
.search-row .btn-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:#fff;font-size:14px;color:var(--muted)}
.search-row .btn-icon:hover{background:#f5f7fa;color:var(--blue)}

/* 类型筛选 */
.type-filter{display:none;flex-wrap:wrap;gap:4px;margin-top:6px}
.type-filter.show{display:flex}
.type-filter .type-btn{padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer;background:#f0f0f0;color:#4e5969;border:1px solid transparent}
.type-filter .type-btn:hover{background:#e0e0e0}
.type-filter .type-btn.active{background:#e8f3ff;color:var(--blue);border-color:var(--blue)}

/* 引用栏 */
.ref-bar{background:#e8f3ff;border:1px solid #b6d4fe;border-radius:var(--radius);padding:6px 10px;margin:6px 12px;font-size:11px;display:none;flex-shrink:0;position:relative;z-index:5}
.ref-bar.show{display:block}
.ref-bar .ref-close{float:right;cursor:pointer;font-size:14px;color:var(--muted)}
.ref-bar img{width:16px;height:16px;vertical-align:middle;margin:0 1px}

/* 文件列表弹窗 */
.file-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200}
.file-modal.show{display:flex;align-items:center;justify-content:center}
.file-modal .modal-mask{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4)}
.file-modal .modal-body{position:relative;background:#fff;border-radius:var(--radius);width:90%;max-width:500px;max-height:70vh;display:flex;flex-direction:column;z-index:1}
.file-modal .modal-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.file-modal .modal-header h4{font-size:14px;font-weight:600}
.file-modal .modal-close{cursor:pointer;font-size:18px;color:var(--muted)}
.file-modal .modal-list{flex:1;overflow-y:auto;padding:4px 0}
.file-modal .file-item{padding:8px 16px;font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-modal .file-item:hover{background:#f5f7fa}
.file-modal .file-item.active{background:#e8f3ff;color:var(--blue)}
.file-modal .file-item .size{color:var(--muted);font-size:11px;margin-left:6px}
.file-modal .modal-footer{padding:8px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.file-modal .modal-footer .page-info{font-size:12px;color:var(--muted)}
.file-modal .modal-footer .page-btns{display:flex;gap:6px}
.file-modal .modal-footer .page-btn{padding:4px 12px;border:1px solid var(--border);border-radius:4px;font-size:12px;cursor:pointer;background:#fff}
.file-modal .modal-footer .page-btn:hover{background:#f5f7fa}
.file-modal .modal-footer .page-btn:disabled{opacity:.5;cursor:not-allowed}

/* 空状态 */
.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:12px}

/* 移动端 */
@media(max-width:768px){
  .play-layout{flex-direction:column}
  .play-left{height:40vh}
  .play-right{width:100%;height:60vh}
  .barrage-header{padding:6px 10px}
  .barrage-header h3{font-size:13px}
  .header-actions{gap:4px}
  .header-actions .icon-btn{width:24px;height:24px;font-size:14px}
  .header-actions label{font-size:10px}
  .header-actions .meta{font-size:10px}
  .barrage-filter{padding:6px 10px}
  .type-filter .type-btn{padding:2px 6px;font-size:10px}
  .barrage-item{padding:5px 10px}
  .barrage-item .user{font-size:12px}
  .barrage-item .content{font-size:12px}
  .barrage-item .grade,.barrage-item .fans{font-size:10px;padding:1px 3px}
  /* 移动端筛选栏悬浮底部 */
  .barrage-filter{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--border)}
  .barrage-list{padding-bottom:60px}
}
</style>
</head>
<body>

<div class="play-layout">
  <div class="play-left">
    <div id="dplayer"></div>
  </div>
  
  <div class="play-right">
    <div class="barrage-panel" id="barragePanel">
      <div class="barrage-header">
        <h3><i class="layui-icon layui-icon-dialogue"></i> 弹幕</h3>
        <div class="header-actions">
          <label><input type="checkbox" id="autoScroll" checked> 滚动</label>
          <span class="meta" id="count">加载中</span>
          <span class="icon-btn" onclick="openFileModal()" title="文件列表"><i class="layui-icon layui-icon-file"></i></span>
          <span class="icon-btn" onclick="toggleSearch()" title="搜索"><i class="layui-icon layui-icon-search"></i></span>
          <span class="icon-btn" onclick="toggleTypes()" title="类型筛选"><i class="layui-icon layui-icon-app"></i></span>
        </div>
      </div>
      
      <div class="ref-bar" id="refBar">
        <span class="ref-close" onclick="hideRef()">✕</span>
        <span id="refUser"></span>
        <span id="refTime"></span>
        <span id="refContent"></span>
      </div>
      
      <div class="barrage-list" id="barrageList"></div>
      
      <div class="barrage-filter" id="filterPanel">
        <div class="search-row" id="searchRow">
          <div class="dropdown" id="searchDropdown">
            <div class="dropdown-btn" onclick="toggleDropdown('searchDropdown')">
              <span id="searchLabel">内容</span>
              <i class="layui-icon layui-icon-down" style="font-size:10px"></i>
            </div>
            <div class="dropdown-menu" id="searchMenu">
              <div class="dropdown-item active" data-value="content" onclick="selectSearchField(this)">内容</div>
              <div class="dropdown-item" data-value="user" onclick="selectSearchField(this)">昵称</div>
            </div>
          </div>
          <input type="text" id="keyword" placeholder="搜索..." oninput="debounceFilter()">
          <span class="btn-icon" onclick="clearSearch()"><i class="layui-icon layui-icon-close"></i></span>
        </div>
        <div class="type-filter" id="typeFilter">
          <span class="type-btn active" data-type="chat" onclick="toggleType(this)">💬 聊天</span>
          <span class="type-btn" data-type="gift" onclick="toggleType(this)">🎁 礼物</span>
          <span class="type-btn" data-type="like" onclick="toggleType(this)">👍 点赞</span>
          <span class="type-btn" data-type="social" onclick="toggleType(this)">❤️ 关注</span>
          <span class="type-btn" data-type="lucky_bag" onclick="toggleType(this)">🧧 福袋</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 文件列表弹窗 -->
<div class="file-modal" id="fileModal">
  <div class="modal-mask" onclick="closeFileModal()"></div>
  <div class="modal-body">
    <div class="modal-header">
      <h4>{{ filename }}</h4>
      <span class="modal-close" onclick="closeFileModal()"><i class="layui-icon layui-icon-close"></i></span>
    </div>
    <div class="modal-list" id="fileList"></div>
    <div class="modal-footer">
      <span class="page-info" id="pageInfo"></span>
      <div class="page-btns">
        <button class="page-btn" id="prevBtn" onclick="filePrev()">上一页</button>
        <button class="page-btn" id="nextBtn" onclick="fileNext()">下一页</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dplayer@1.27.1/dist/DPlayer.min.js"></script>
<script>
// ── 配置 ──
const VIDEO_START = {{ video_start }};
const VIDEO_END = {{ video_end }};
const HAS_BARRAGE = {{ 'true' if has_barrage else 'false' }};
const DB_PATH = '{{ db_path }}';
const SEEK_TIME = {{ seek_time }};
const CURRENT_PATH = '{{ current_path }}';

// ── 文件列表数据 ──
const ALL_FILES = [
  {% for af in anchor_files %}
  { path: '{{ af.path }}', name: '{{ af.name }}', size: {{ af.size_mb }} }{% if not loop.last %},{% endif %}
  {% endfor %}
];

// ── 状态 ──
let dp = null;
let allBarrage = [];
let visibleBarrage = [];
let activeIdx = -1;
let userScrolling = false;
let initialLoading = true;  // 初始弹幕加载中，禁用自动加载
let scrollTimer = null;
let refTimer = null;
let filterTimer = null;
let emojiMap = {};
let emojiRegexes = null;
let hasEmoji = null;

// ── 文件分页 ──
const FILE_PAGE_SIZE = 20;
let filePage = 0;
const fileTotalPages = Math.ceil(ALL_FILES.length / FILE_PAGE_SIZE);

// ── 弹幕分页 ──
const PAGE_SIZE = 1000;
let lastCursor = 0;
let hasMore = true;
let loading = false;

// ── 初始化 ──
document.addEventListener('DOMContentLoaded', init);

async function init() {
  dp = new DPlayer({
    container: document.getElementById('dplayer'),
    video: { url: '{{ video_url }}' },
    autoplay: true
  });
  
  if (SEEK_TIME > 0) {
    dp.on('loadedmetadata', () => dp.seek(SEEK_TIME));
  }
  
  await loadEmoji();
  bindEvents();
  
  if (!HAS_BARRAGE || !VIDEO_START) {
    showEmpty('无弹幕');
    return;
  }
  
  await loadBarrage(0);
  // 列表没填满视口且还有更多 → 自动继续加载（防止不足2000条时滚到底部）
  const list = document.getElementById('barrageList');
  let loadAttempts = 0;
  while (hasMore && list.scrollHeight <= list.clientHeight && loadAttempts < 10) {
    const prevCount = allBarrage.length;
    await loadBarrage(lastCursor);
    if (allBarrage.length === prevCount) break;  // 加载失败或无新数据，退出
    loadAttempts++;
  }
  // 初始加载完成后，延迟解锁滚动事件，确保渲染和滚动位置稳定
  setTimeout(() => { initialLoading = false; }, 500);
}

async function loadEmoji() {
  try {
    const r = await fetch('/emoji.json');
    const d = await r.json();
    for (const e of d.emoji_list || []) {
      const n = e.display_name, u = (e.emoji_url?.url_list || [])[0] || '';
      if (n && u) emojiMap[n] = u;
    }
    buildEmojiRegexes();
  } catch (e) {}
}

function buildEmojiRegexes() {
  const arr = [], names = [];
  for (const [name, url] of Object.entries(emojiMap)) {
    const safe = name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    arr.push({ re: new RegExp(safe, 'g'), url, name });
    names.push(safe);
  }
  emojiRegexes = arr;
  hasEmoji = names.length ? new RegExp(names.join('|')) : null;
}

function bindEvents() {
  const list = document.getElementById('barrageList');
  
  list.addEventListener('scroll', () => {
    if (initialLoading || loading) return;
    userScrolling = true;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => { userScrolling = false; }, 300);
    
    const { scrollTop, scrollHeight, clientHeight } = list;
    if (scrollHeight - scrollTop - clientHeight < 200 && hasMore) {
      loadBarrage(lastCursor);
    }
  }, { passive: true });
  
  list.addEventListener('click', (e) => {
    const at = e.target.closest('.at');
    if (at) { e.stopPropagation(); const item = e.target.closest('.barrage-item'); showMention(at.dataset.at, item ? parseInt(item.dataset.idx) : undefined); return; }
    
    const user = e.target.closest('.user');
    if (user) {
      document.getElementById('keyword').value = user.dataset.user;
      // 设置搜索字段为昵称
      document.getElementById('searchLabel').textContent = '昵称';
      document.querySelectorAll('#searchMenu .dropdown-item').forEach(item => {
        item.classList.toggle('active', item.dataset.value === 'user');
      });
      // 自动显示搜索框
      document.getElementById('searchRow').classList.add('show');
      applyFilter();
      return;
    }
    
    const item = e.target.closest('.barrage-item');
    if (item && dp) {
      dp.seek(parseInt(item.dataset.offset));
      dp.play();
    }
  });
  
  let lastUpdate = 0;
  dp.on('timeupdate', () => {
    const now = performance.now();
    if (now - lastUpdate < 300) return;
    lastUpdate = now;
    
    const currentTime = dp.video.currentTime;
    let lo = 0, hi = visibleBarrage.length - 1, found = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (visibleBarrage[mid].offset <= currentTime) { found = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    
    if (found >= 0 && visibleBarrage[found].idx !== activeIdx) {
      activeIdx = visibleBarrage[found].idx;
      highlightItem();
    }
  });
}

// ── 搜索切换 ──
function toggleSearch() {
  document.getElementById('searchRow').classList.toggle('show');
}

function toggleTypes() {
  document.getElementById('typeFilter').classList.toggle('show');
}

function clearSearch() {
  document.getElementById('keyword').value = '';
  applyFilter();
}

// ── 下拉框 ──
function toggleDropdown(id) {
  const menu = document.getElementById(id).querySelector('.dropdown-menu');
  menu.classList.toggle('show');
}

function selectSearchField(el) {
  const value = el.dataset.value;
  const label = el.textContent;
  document.getElementById('searchLabel').textContent = label;
  // 更新 active 状态
  document.querySelectorAll('#searchMenu .dropdown-item').forEach(item => {
    item.classList.toggle('active', item.dataset.value === value);
  });
  // 关闭下拉菜单
  document.getElementById('searchMenu').classList.remove('show');
  applyFilter();
}

// 点击外部关闭下拉框
document.addEventListener('click', (e) => {
  if (!e.target.closest('.dropdown')) {
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
      menu.classList.remove('show');
    });
  }
});

// ── 文件列表弹窗 ──
function openFileModal() {
  document.getElementById('fileModal').classList.add('show');
  renderFileList();
}

function closeFileModal() {
  document.getElementById('fileModal').classList.remove('show');
}

function renderFileList() {
  const start = filePage * FILE_PAGE_SIZE;
  const end = Math.min(start + FILE_PAGE_SIZE, ALL_FILES.length);
  const files = ALL_FILES.slice(start, end);
  
  const html = files.map(f => {
    const cls = f.path === CURRENT_PATH ? 'file-item active' : 'file-item';
    const name = f.name.length > 40 ? f.name.substring(0, 35) + '...' + f.name.split('.').pop() : f.name;
    return `<div class="${cls}" onclick="location.href='/play${f.path}'" title="${f.name}">${name}<span class="size">${f.size}MB</span></div>`;
  }).join('');
  
  document.getElementById('fileList').innerHTML = html || '<div class="empty-state">暂无文件</div>';
  document.getElementById('pageInfo').textContent = `${filePage + 1}/${fileTotalPages || 1}`;
  document.getElementById('prevBtn').disabled = filePage <= 0;
  document.getElementById('nextBtn').disabled = filePage >= fileTotalPages - 1;
}

function filePrev() {
  if (filePage > 0) { filePage--; renderFileList(); }
}

function fileNext() {
  if (filePage < fileTotalPages - 1) { filePage++; renderFileList(); }
}

// ── 类型筛选 ──
function toggleType(el) {
  el.classList.toggle('active');
  lastCursor = 0;
  hasMore = true;
  allBarrage = [];
  loadBarrage(0);
}

// ── 加载弹幕 ──
async function loadBarrage(cursor) {
  if (loading) return;
  loading = true;
  document.getElementById('count').textContent = '加载中';
  
  const types = [];
  document.querySelectorAll('#typeFilter .type-btn.active').forEach(btn => types.push(btn.dataset.type));
  
  try {
    const params = new URLSearchParams({
      db_path: DB_PATH,
      time_from: VIDEO_START,
      time_to: VIDEO_END || '',
      limit: PAGE_SIZE,
      cursor: cursor || 0,
      sort: 'asc',
      types: types.join(',')
    });
    
    const resp = await fetch('/api/barrage?' + params);
    if (!resp.ok) throw new Error(resp.status);
    
    const data = await resp.json();
    const barrage = data.barrage || [];
    hasMore = barrage.length >= PAGE_SIZE;
    
    allBarrage = cursor ? allBarrage.concat(barrage) : barrage;
    // 游标+1避免重复（>= cursor 会返回相同时间戳的行）
    lastCursor = data.cursor ? data.cursor + 1 : 0;
    
    document.getElementById('count').textContent = allBarrage.length + '条';
    applyFilter();
  } catch (e) {
    console.error('加载失败:', e);
    if (!cursor) showEmpty('加载失败');
  } finally {
    loading = false;
  }
}

// ── 筛选 ──
function debounceFilter() {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(applyFilter, 200);
}

function applyFilter() {
  const keyword = document.getElementById('keyword').value.trim().toLowerCase();
  // 从下拉框获取搜索字段
  const searchField = document.querySelector('#searchMenu .dropdown-item.active')?.dataset.value || 'content';
  
  if (!keyword) {
    visibleBarrage = allBarrage.map((b, i) => ({ ...b, idx: i }));
  } else {
    visibleBarrage = [];
    for (let i = 0; i < allBarrage.length; i++) {
      const b = allBarrage[i];
      const target = searchField === 'user' ? b.user : b.content;
      if ((target || '').toLowerCase().includes(keyword)) {
        visibleBarrage.push({ ...b, idx: i });
      }
    }
  }
  renderList();
}

// ── 渲染列表 ──
function renderList() {
  const list = document.getElementById('barrageList');
  if (!visibleBarrage.length) { list.innerHTML = '<div class="empty-state">暂无弹幕</div>'; return; }
  
  const html = visibleBarrage.map(b => {
    const cls = (b.type || 'chat') + (b.idx === activeIdx ? ' active' : '');
    
    // 粉丝团等级（在前）
    let fans = '';
    if (b.fans_club) {
      const m = b.fans_club.match(/粉丝团(?::(.+?))?\s*Lv(\d+)/);
      if (m) {
        const name = m[1] || '';
        const lv = parseInt(m[2]);
        const fcls = lv <= 5 ? 'fans-1' : lv <= 10 ? 'fans-6' : lv <= 15 ? 'fans-11' : lv <= 20 ? 'fans-16' : 'fans-21';
        fans = `<span class="fans ${fcls}">${name ? esc(name) + ' ' : ''}Lv${lv}</span>`;
      }
    }
    
    // 抖音财富等级（在后）
    let grade = '';
    if (b.grade) {
      const lv = parseInt(b.grade);
      if (!isNaN(lv) && lv > 0) {
        let gcls = 'grade-1';
        if (lv >= 70) gcls = 'grade-70';
        else if (lv >= 61) gcls = 'grade-61';
        else if (lv >= 51) gcls = 'grade-51';
        else if (lv >= 41) gcls = 'grade-41';
        else if (lv >= 31) gcls = 'grade-31';
        else if (lv >= 21) gcls = 'grade-21';
        else if (lv >= 13) gcls = 'grade-13';
        else if (lv >= 6) gcls = 'grade-6';
        grade = `<span class="grade ${gcls}">Lv${lv}</span>`;
      }
    }
    
    return `<div class="barrage-item ${cls}" data-idx="${b.idx}" data-offset="${b.offset}">
      <span class="user-info">${fans}${grade}<span class="user" data-user="${esc(b.user || '')}">${esc(b.user || '')}</span></span>
      <span class="content">${renderContent(b.content)}</span>
    </div>`;
  }).join('');
  
  // 保存滚动位置（列表未溢出时 wasAtBottom 应为 false）
  const wasEmpty = list.scrollHeight === 0;
  const overflow = list.scrollHeight > list.clientHeight;
  const wasAtBottom = overflow && (list.scrollHeight - list.scrollTop - list.clientHeight < 100);
  
  list.innerHTML = html;
  
  if (!userScrolling && document.getElementById('autoScroll').checked) {
    if (wasEmpty) {
      // 初始加载：有 active 弹幕则跟随，否则滚到顶部
      const activeEl = list.querySelector('.barrage-item.active');
      if (activeEl) {
        activeEl.scrollIntoView({ block: 'center' });
      } else {
        list.scrollTop = 0;
      }
    } else if (wasAtBottom) {
      list.scrollTop = list.scrollHeight;
    } else {
      const activeEl = list.querySelector('.barrage-item.active');
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }
}

function highlightItem() {
  const list = document.getElementById('barrageList');
  const old = list.querySelector('.barrage-item.active');
  if (old) old.classList.remove('active');
  
  const item = list.querySelector(`[data-idx="${activeIdx}"]`);
  if (item) {
    item.classList.add('active');
    if (!userScrolling && document.getElementById('autoScroll').checked) {
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

// ── 渲染内容 ──
function renderContent(text) {
  if (!text) return '';
  // 先用占位符替换 @ 提及
  const mentions = [];
  let html = text.replace(/@(\S{1,20})/g, (m, name) => {
    mentions.push(name);
    return `__MENTION_${mentions.length - 1}__`;
  });
  // 转义其他内容
  html = esc(html);
  // 恢复 @ 提及
  mentions.forEach((name, i) => {
    html = html.replace(`__MENTION_${i}__`, `<span class="at" data-at="${esc(name)}">@${esc(name)}</span>`);
  });
  if (emojiRegexes && hasEmoji && hasEmoji.test(html)) {
    for (const { re, url, name } of emojiRegexes) {
      html = html.replace(re, `<img src="${url}" alt="${name}">`);
    }
  }
  return html;
}

// ── @ 提及（先本地找，找不到再跨类型 API 查询）──
async function showMention(name, fromIdx) {
  const refUser = document.getElementById('refUser');
  const refTime = document.getElementById('refTime');
  const refContent = document.getElementById('refContent');
  
  refUser.textContent = '@' + name;
  
  // 先在已加载数据中找（即时）
  const startIdx = (typeof fromIdx === 'number') ? fromIdx : allBarrage.length;
  let found = null;
  for (let j = startIdx - 1; j >= 0; j--) {
    if (allBarrage[j].user === name) { found = allBarrage[j]; break; }
  }
  
  if (found) {
    refTime.textContent = formatTime(found.offset);
    refContent.innerHTML = renderContent(found.content);
  } else {
    // 本地没找到，跨类型 API 查询
    refTime.textContent = '';
    refContent.innerHTML = '<span style="color:#86909c">查询中...</span>';
    try {
      const currentMsg = (typeof fromIdx === 'number') ? visibleBarrage.find(b => b.idx === fromIdx) : null;
      const timeTo = currentMsg ? (VIDEO_START + currentMsg.offset) : VIDEO_END || '';
      const params = new URLSearchParams({
        db_path: DB_PATH, time_from: VIDEO_START, time_to: timeTo,
        limit: 1, sort: 'desc', types: 'gift', user: name
      });
      const resp = await fetch('/api/barrage?' + params);
      const data = await resp.json();
      const apiFound = (data.barrage || [])[0];
      if (apiFound) {
        refTime.textContent = formatTime(apiFound.offset);
        refContent.innerHTML = renderContent(apiFound.content);
      } else {
        refContent.innerHTML = '<span style="color:#86909c">暂无更早发言</span>';
      }
    } catch (e) {
      refContent.innerHTML = '<span style="color:#86909c">查询失败</span>';
    }
  }
  
  document.getElementById('refBar').classList.add('show');
  clearTimeout(refTimer);
  refTimer = setTimeout(hideRef, 5000);
}

function hideRef() { document.getElementById('refBar').classList.remove('show'); }

// ── 工具函数 ──
function formatTime(offset) {
  const d = new Date((VIDEO_START + offset) * 1000);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showEmpty(msg) {
  document.getElementById('barrageList').innerHTML = `<div class="empty-state">${msg}</div>`;
  document.getElementById('count').textContent = msg;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeFileModal();
});
</script>
